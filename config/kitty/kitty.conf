font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12
enable_audio_bell no
clipboard_control write-clipboard write-primary no-append # fix an issue with tmux clipboard appending text instead of replacing it

# Colours live in dark-theme.auto.conf, light-theme.auto.conf and
# no-preference-theme.auto.conf. When those files exist kitty queries the OS
# colour scheme, picks the matching one and re-reads it whenever the OS scheme
# changes. Colours set here would be overridden by them, so keep this file free
# of colour settings.
