set-option -g mouse on
set-option -g default-shell "$SHELL"
set-option -g base-index 1
# True color settings
set-option -g default-terminal "$TERM"
set-option -ag terminal-overrides ",$TERM:Tc"
set-window-option -g xterm-keys on
set-window-option -g pane-base-index 1
set-option -s escape-time 0
set-option -s set-clipboard external # use OSC 52

set-hook -g client-light-theme 'source-file ~/.config/tmux/theme-light.conf'
set-hook -g client-dark-theme  'source-file ~/.config/tmux/theme-dark.conf'
source-file ~/.config/tmux/theme-light.conf

bind -n C-l send-keys -R \; send-keys C-l \; clear-history

# session switcher. The script ships with the work dotfiles, so this binding
# does nothing on machines that do not have it.
bind-key f run-shell 'tmux neww ~/.local/bin/tmux-session'

# setup Vim mode
set-window-option -g mode-keys vi

# split panes
bind-key c new-window -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
bind-key '%' split-window -h -c "#{pane_current_path}"

# move to panes using Vim arrows
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# resize panes using vim arrows
bind-key -r H resize-pane -L
bind-key -r J resize-pane -D
bind-key -r K resize-pane -U
bind-key -r L resize-pane -R
